# Vulcan 运行配置（密钥一律走环境变量，不写在这里）

gateway:
  host: 127.0.0.1   # 硬约束：仅 loopback；对外暴露须经 reverse proxy
  port: 7620
  maxBodyBytes: 1048576

meegle:
  baseUrl: https://meegle.com

db:
  path: data/vulcan.db

agent:
  maxSteps: 50
  tokenBudget: 160000
  costUsdBudget: 5

session:
  summaryEverySteps: 15
  summaryAtBudgetPct: 60

retry:
  maxAttempts: 3

# 环境变量清单：
#   VULCAN_WEBHOOK_SECRET_ALERT      告警 webhook HMAC 密钥
#   VULCAN_WEBHOOK_SECRET_MEEGLE     meegle webhook HMAC 密钥
#   VULCAN_WEBHOOK_SECRET_APPROVAL   审批 webhook HMAC 密钥
#   VULCAN_MEEGLE_PLUGIN_TOKEN       meegle Open API X-PLUGIN-TOKEN
#   VULCAN_MEEGLE_USER_KEY           meegle Open API X-USER-KEY
#   VULCAN_LARK_WEBHOOK              飞书机器人 webhook（人工审批通知）
